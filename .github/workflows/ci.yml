name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Swift 6.2 on Linux
    runs-on: ubuntu-latest
    container: swift:6.2-jammy
    env:
      SWIFTWEBSCRAPER_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test (includes live-network tests of the default client)
        run: swift test
